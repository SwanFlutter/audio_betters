name: audio_betters
description: "Cross-platform audio playback, recording, and voice-activated conversation mode (hands-free, ChatGPT-style voice capture) for Android, iOS, macOS, Windows, Linux, and Web."
version: 1.0.0

environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  web: ^1.1.2
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0


flutter:
 
  plugin:
    platforms:
      android:
        package: com.example.audio_betters
        pluginClass: AudioBettersPlugin
      ios:
        pluginClass: AudioBettersPlugin
      linux:
        pluginClass: AudioBettersPlugin
      macos:
        pluginClass: AudioBettersPlugin
      windows:
        pluginClass: AudioBettersPluginCApi
      web:
        pluginClass: AudioBettersWeb
        fileName: audio_betters_web.dart


